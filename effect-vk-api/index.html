<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Effect Compassion API</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#0f1115;color:#fff;margin:0;padding:28px}
.card{max-width:820px;margin:auto;background:#171a21;border-radius:18px;padding:26px}
button{font-size:17px;padding:13px 18px;border:0;border-radius:12px;cursor:pointer;margin:7px 7px 7px 0}
#status{margin:16px 0}.ok{color:#9fda9f}.err{color:#ff9b9b}
pre{white-space:pre-wrap;background:#0b0d11;border:1px solid #333;border-radius:10px;padding:14px;min-height:120px}
</style>
</head>
<body><div class="card">
<h1>Effect Compassion API</h1>
<p>Техническая панель настройки официального сообщества фильма.</p>
<button id="auth">1. Авторизовать VK API</button>
<button id="finish" disabled>2. Завершить настройку</button>
<div id="status">Инициализация…</div>
<pre id="log"></pre>
</div>
<script>
const APP_ID=54783165, GROUP_ID=241430340, OWNER_ID=-241430340;
let TOKEN='';
const $=id=>document.getElementById(id), logEl=$('log'), statusEl=$('status');
function log(s){logEl.textContent += s+'\n'; logEl.scrollTop=logEl.scrollHeight;}
function err(e){const d=e&&e.error_data?e.error_data:{};return [d.error_code,d.error_reason,d.error_msg,d.error_type].filter(Boolean).join(' | ')||(e&&e.message)||'unknown';}
async function api(method,params={}){
  const r=await vkBridge.send('VKWebAppCallAPIMethod',{method,params:{...params,access_token:TOKEN,v:'5.199'}});
  return r.response;
}
async function auth(){
  statusEl.textContent='Запрашиваем права groups, wall, photos, video…';
  const d=await vkBridge.send('VKWebAppGetAuthToken',{app_id:APP_ID,scope:'groups,wall,photos,video'});
  TOKEN=d.access_token||'';
  if(!TOKEN) throw new Error('VK не вернул access_token');
  statusEl.textContent='Авторизация готова. Права: '+(d.scope||'groups,wall,photos,video');
  statusEl.className='ok'; $('finish').disabled=false; log('AUTH_OK');
}
const duplicateIds=[4,18,20,26,28,103,104,105,106,107,108,109,110,111,112,113,114,115,116,117,118,119,120];
const videos=[
 {post:94,url:'https://rutube.ru/video/adffb7589413c3cfc2e89c95970c3dc8/',name:'Эффект компассии — интервью с режиссёром Евгением Сивковым',text:'🎬 Интервью с режиссёром Евгением Сивковым о фильме «Эффект компассии»: замысел картины, герои, технологии и главный вопрос — что остаётся за человеком, когда машина следует алгоритму? #ЭффектКомпассии #ЕвгенийСивков #интервью #российскоекино'},
 {post:95,url:'https://rutube.ru/video/4e5a17be7dc054c45bc2f5401b7828b3/',name:'Эффект компассии — Анна Славина о фильме',text:'🎭 Анна Славина — о работе над ролью, атмосфере на съёмочной площадке и человеческих темах «Эффекта компассии». #ЭффектКомпассии #АннаСлавина #актриса #интервью'},
 {post:96,url:'https://rutube.ru/video/94e0a21ce7784585b0c55128d23d3a75/',name:'Эффект компассии — как ставили танцы для роботов',text:'🤖 Как ставили танцы для роботов в «Эффекте компассии». За кадром — хореография, пластика и поиск выразительного языка движения для мира фильма. #ЭффектКомпассии #роботы #закадром #съемки'},
 {post:97,url:'https://rutube.ru/video/160e71f67d98007211f691c8dd5c02d7/',name:'Эффект компассии — котёнок на съёмках',text:'🐱 Иногда самый человеческий момент на съёмочной площадке — тот, который никто не планировал. Котёнок на съёмках «Эффекта компассии». #ЭффектКомпассии #закадром #съемочнаяплощадка'},
 {post:98,url:'https://rutube.ru/video/aed34ce927bfcd0bcd3603b785d89fe4/',name:'Эффект компассии — ансамбль Цветень на съёмках',text:'🎵 Ансамбль «Цветень» на съёмочной площадке «Эффекта компассии»: встреча современного кино, технологий и русской музыкальной традиции. #ЭффектКомпассии #Цветень #русскийфольклор #кино'},
 {post:99,url:'https://rutube.ru/video/0a71144942b0297ee465a027486e4278/',name:'Эффект компассии — интервью с Сергеем Гриматиным',text:'🎙 Интервью с Сергеем Гриматиным о «Эффекте компассии»: человек и технологии, сострадание и выбор, который невозможно свести к алгоритму. #ЭффектКомпассии #интервью #ИИ #роботы'},
 {post:100,url:'https://rutube.ru/video/5216172ca6c4d49af8eb7d8ffa15d973/',name:'Эффект компассии — добро меняет человека',text:'❤️ Фрагмент фильма «Эффект компассии»: добро меняет человека. Что сильнее — обстоятельства, технология или один человеческий поступок? #ЭффектКомпассии #фрагментфильма #добро #российскоекино'},
 {post:101,url:'https://rutube.ru/video/fa752d323dc9e40576c8b1223fac413c/',name:'Эффект компассии — финальные работы над фильмом',text:'🎞 Команда «Эффекта компассии» на финишной прямой: финальные просмотры, звук, постпродакшн и последние штрихи перед дальнейшим продвижением фильма. #ЭффектКомпассии #постпродакшн #какСнималиКино'},
 {post:102,url:'https://rutube.ru/video/9d80f4e9cb4dc099d1310e9546b3d41f/',name:'Эффект компассии — сюжет Первого канала Майкопа',text:'📺 Сюжет Первого канала Майкопа о фильме «Эффект компассии»: герои, создатели и история картины о человеке, любви, технологиях и свободе выбора. #ЭффектКомпассии #телесюжет #российскоекино'}
];
async function finish(){
 $('finish').disabled=true; logEl.textContent='';
 let delOk=0;
 for(const id of duplicateIds){
  try{await api('wall.delete',{owner_id:OWNER_ID,post_id:id}); delOk++; log('DELETE_OK '+id);}
  catch(e){log('DELETE_SKIP '+id+' '+err(e));}
 }
 try{await api('wall.pin',{owner_id:OWNER_ID,post_id:3});log('PIN_OK 3');}catch(e){log('PIN_SKIP '+err(e));}
 for(const [link,text] of [
  ['https://rutube.ru/channel/28123243/','RUTUBE — видео фильма'],
  ['https://t.me/Compassioneffect','Telegram — Эффект компассии'],
  ['https://www.youtube.com/@%D0%AD%D1%84%D1%84%D0%B5%D0%BA%D1%82%D0%9A%D0%BE%D0%BC%D0%BF%D0%B0%D1%81%D1%81%D0%B8%D0%B8','YouTube — Эффект компассии']
 ]){
  try{await api('groups.addLink',{group_id:GROUP_ID,link,text});log('LINK_OK '+text);}catch(e){log('LINK_SKIP '+text+' '+err(e));}
 }
 let videoOk=0;
 for(const v of videos){
  try{
   const sv=await api('video.save',{group_id:GROUP_ID,name:v.name,description:v.text,link:v.url,wallpost:0});
   if(!sv || !sv.video_id) throw new Error('video_id missing');
   const att='video'+sv.owner_id+'_'+sv.video_id+(sv.access_key?'_'+sv.access_key:'');
   await api('wall.edit',{owner_id:OWNER_ID,post_id:v.post,message:v.text,attachments:att});
   videoOk++; log('VIDEO_OK post='+v.post+' video='+sv.video_id);
  }catch(e){log('VIDEO_FAIL post='+v.post+' '+err(e));}
 }
 try{
  const q=await api('wall.get',{owner_id:OWNER_ID,filter:'postponed',count:100});
  log('QUEUE_COUNT '+(q?.count??'unknown'));
 }catch(e){log('QUEUE_CHECK_FAIL '+err(e));}
 statusEl.textContent='Готово: удалено дублей '+delOk+'; нативных видео '+videoOk+' из '+videos.length+'.';
 statusEl.className=videoOk===videos.length?'ok':'err';
 $('finish').disabled=false;
}
$('auth').onclick=()=>auth().catch(e=>{statusEl.textContent='Ошибка авторизации: '+err(e);statusEl.className='err';});
$('finish').onclick=()=>finish().catch(e=>{statusEl.textContent='Ошибка завершения: '+err(e);statusEl.className='err';$('finish').disabled=false;});
vkBridge.send('VKWebAppInit').then(()=>{statusEl.textContent='VK Bridge готов. Нажмите «1. Авторизовать VK API».';}).catch(e=>{statusEl.textContent='Ошибка VK Bridge';statusEl.className='err';});
</script></body></html>
